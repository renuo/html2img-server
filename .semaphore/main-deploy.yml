version: v1.0
name: main-deploy
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
blocks:
  - name: main-deploy
    execution_time_limit:
      minutes: 10
    task:
      secrets:
        - name: mugshotbot
        - name: ghcr
      env_vars:
        - name: IMAGE
          value: ghcr.io/coorasse/html2img-server
      jobs:
        - name: main-deploy
          commands:
            - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            - docker buildx imagetools create -t $IMAGE:latest $IMAGE:$SEMAPHORE_GIT_SHA
            - chmod 600 /home/semaphore/.ssh/dokku
            - ssh -i /home/semaphore/.ssh/dokku -o StrictHostKeyChecking=no dokku@5.161.119.37 git:from-image html2img-server $IMAGE:$SEMAPHORE_GIT_SHA
