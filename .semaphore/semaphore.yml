version: "v1.0"
name: mugshotbot
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
auto_cancel:
  running:
    when: "true"
fail_fast:
  cancel:
    when: "branch != 'main'"
blocks:
  - name: "Noop"
    task:
      jobs:
        - name: "Noop"
          commands:
            - echo "ok"
promotions:
  - name: develop
    pipeline_file: develop-deploy.yml
    auto_promote:
      when: "true"
    deployment_target: develop
  - name: main
    pipeline_file: main-deploy.yml
    auto_promote:
      when: "true"
    deployment_target: main
