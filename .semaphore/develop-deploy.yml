version: v1.0
name: develop-deploy
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
blocks:
  - name: develop-deploy
    execution_time_limit:
      minutes: 10
    task:
      secrets:
        - name: mugshotbot
      jobs:
        - name: develop-deploy
          commands:
            - checkout --use-cache
            - git remote add dokku ssh://dokku@95.217.158.229:22/html2img-server
            - chmod 600 /home/semaphore/.ssh/dokku
            - GIT_SSH_COMMAND="ssh -i /home/semaphore/.ssh/dokku -o StrictHostKeyChecking=no" git push dokku -f $SEMAPHORE_GIT_BRANCH:develop
