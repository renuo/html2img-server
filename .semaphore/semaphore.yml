version: "v1.0"
name: html2img-server
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
auto_cancel:
  running:
    when: "true"
fail_fast:
  cancel:
    when: "branch != 'main'"

blocks:
  - name: test
    dependencies: []
    execution_time_limit:
      minutes: 5
    task:
      env_vars:
        - name: API_TOKEN
          value: "1234"
        - name: APP_PORT
          value: ":3000"
        - name: CHROME_BIN
          value: google-chrome
      prologue:
        commands:
          - checkout
          - sem-version go 1.24
      jobs:
        - name: go test
          commands:
            - go build -v ./...
            - go test -v ./...
      epilogue:
        on_fail:
          commands:
            - artifact push job --expire-in 2w *.png || true
            - artifact push job --expire-in 2w *.log || true

  - name: build image
    dependencies: []
    execution_time_limit:
      minutes: 10
    task:
      secrets:
        - name: ghcr
      env_vars:
        - name: IMAGE
          value: ghcr.io/coorasse/html2img-server
      jobs:
        - name: docker build and push
          commands:
            - checkout
            - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            - docker run --privileged --rm tonistiigi/binfmt --install arm64
            - docker buildx create --use
            - >-
              docker buildx build --push
              --platform linux/amd64,linux/arm64
              --cache-from type=registry,ref=$IMAGE:buildcache
              --cache-to type=registry,ref=$IMAGE:buildcache,mode=max
              -t $IMAGE:$SEMAPHORE_GIT_SHA .

promotions:
  - name: main
    pipeline_file: main-deploy.yml
    auto_promote:
      when: "result = 'passed' and branch = 'main'"
    deployment_target: main
